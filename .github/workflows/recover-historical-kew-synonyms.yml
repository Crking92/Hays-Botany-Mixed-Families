name: Bulk Kew verified historical photo synonyms
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-historical-kew-synonyms.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-Hays-Botany-Mixed-Families-photo-publisher
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin staging/original-source-transfer
          git worktree add "$RUNNER_TEMP/archive" origin/staging/original-source-transfer
      - uses: actions/checkout@v4
        with:
          repository: Crking92/Hays-Botany-Public
          ref: 029f2a009ff236706b41aa3d1f4f1d23de3ad446
          path: .shared-photo-audit
          persist-credentials: false
      - run: python3 -m pip install Pillow==11.3.0
      - name: Publish source-checked Kew synonym photo originals
        run: |
          python3 .shared-photo-audit/scripts/recover_historical_kew_synonyms.py \
            --source-root "$RUNNER_TEMP/archive" --site-root site \
            --repository "$GITHUB_REPOSITORY" --publisher family --limit 80
      - name: Commit verified gallery updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/gallery-index.json site/data/collection-index.json workflow/multi-family-historical-kew-synonyms-2026-11-03.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "Publish original source Kew synonym historical photos"
          git pull --rebase origin main
          git push origin HEAD:main
