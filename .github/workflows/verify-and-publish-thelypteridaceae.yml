name: Check source and publish Thelypteridaceae general fern photographs
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-photo-manifests/thelypteridaceae-2026-11-02.json'
      - 'scripts/verify_thelypteridaceae_original_media.py'
      - '.github/workflows/verify-and-publish-thelypteridaceae.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: mixed-families-photo-release
  cancel-in-progress: false
jobs:
  publish-ferns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Confirm individual fern photo licenses, taxon, original ZIP SHA256
        run: python3 scripts/verify_thelypteridaceae_original_media.py
      - name: Install cleared images into real species website galleries
        run: |
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/thelypteridaceae-verified" --site-root site --check
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/thelypteridaceae-verified" --site-root site
          python3 scripts/verify_automatic_gallery.py --site-root site
          python3 scripts/build_collection_preview.py
      - name: Commit exact original image files and credits to existing website
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Nothing qualified for publication; source verification report preserves holds"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Install source-verified Thelypteridaceae general fern photos with credits"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Request public Pages rebuild after bot image publication
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thelypteridaceae-source-photo-rights-review
          path: ${{ runner.temp }}/thelypteridaceae-photo-specific-rights.json
          if-no-files-found: warn
          retention-days: 30
